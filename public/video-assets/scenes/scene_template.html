<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene Slide Renderer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 100px;
      position: relative;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage-content">
    <!-- Clean Dynamic Visual Stage Content (No Corner Time Badge, No Subtitle Text Bar) -->
  </div>
</body>
</html>
