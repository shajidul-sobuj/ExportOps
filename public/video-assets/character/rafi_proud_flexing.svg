<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <!-- Transparent Background -->
  
  <!-- Subtle floor shadow -->
  <ellipse cx="400" cy="710" rx="240" ry="25" fill="#e2e8f0" />
  
  <!-- Garment Export Cartons Stack (Left) -->
  <g id="carton-stack" transform="translate(100, 420)">
    <!-- Box 1 (Bottom) -->
    <rect x="0" y="160" width="160" height="120" rx="6" fill="#fef3c7" stroke="#0f172a" stroke-width="5" />
    <line x1="80" y1="160" x2="80" y2="280" stroke="#0f172a" stroke-width="4" stroke-dasharray="8 6" />
    <rect x="25" y="200" width="110" height="40" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <text x="80" y="225" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#0f172a" text-anchor="middle">12,000 PCS RMG</text>
    
    <!-- Box 2 (Top Left) -->
    <rect x="20" y="50" width="140" height="110" rx="6" fill="#fde68a" stroke="#0f172a" stroke-width="5" />
    <line x1="90" y1="50" x2="90" y2="160" stroke="#0f172a" stroke-width="4" stroke-dasharray="8 6" />
    <path d="M40 80 L60 80 L50 120 Z" fill="#0d9488" />
    <text x="100" y="105" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#0f172a">BERTH 4</text>
  </g>

  <!-- Rafi: The Muscular Stickman (Center) -->
  <g id="rafi-character" transform="translate(120, 0)">
    
    <!-- Legs -->
    <path d="M280 470 L260 700" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
    <path d="M340 470 L360 700" stroke="#0f172a" stroke-width="14" stroke-linecap="round" />
    
    <!-- Heavy Work Boots -->
    <path d="M240 700 L285 700 L285 680 L250 680 Z" fill="#0f172a" stroke="#0f172a" stroke-width="6" stroke-linejoin="round" />
    <path d="M340 700 L385 700 L385 680 L350 680 Z" fill="#0f172a" stroke="#0f172a" stroke-width="6" stroke-linejoin="round" />

    <!-- Muscular Torso & Chest -->
    <!-- Broad V-Taper Torso with Safety Vest -->
    <path d="M220 280 L390 280 L350 480 L260 480 Z" fill="#0d9488" stroke="#0f172a" stroke-width="12" stroke-linejoin="round" />
    
    <!-- High-Vis Vest Reflective Stripes -->
    <path d="M255 280 L275 480" stroke="#ffffff" stroke-width="14" stroke-linecap="square" />
    <path d="M355 280 L335 480" stroke="#ffffff" stroke-width="14" stroke-linecap="square" />
    <path d="M235 390 L375 390" stroke="#facc15" stroke-width="12" />

    <!-- Defined Pectorals / Chest Line -->
    <path d="M260 340 Q305 370 350 340" stroke="#0f172a" stroke-width="7" stroke-linecap="round" fill="none" />
    <line x1="305" y1="310" x2="305" y2="420" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

    <!-- Left Arm: Proud Double-Bicep Flex -->
    <!-- Shoulder -->
    <circle cx="220" cy="285" r="26" fill="#f8fafc" stroke="#0f172a" stroke-width="10" />
    <!-- Bicep & Forearm (bent upward flexing) -->
    <path d="M210 290 Q150 280 160 210 Q190 200 210 230" fill="#f8fafc" stroke="#0f172a" stroke-width="10" stroke-linejoin="round" />
    <!-- Bicep Muscle Bulge Curve -->
    <path d="M165 245 Q150 230 168 215" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Left Fist -->
    <circle cx="215" cy="225" r="22" fill="#f8fafc" stroke="#0f172a" stroke-width="10" />

    <!-- Right Arm: Proud Flex on Hip / Bicep -->
    <!-- Shoulder -->
    <circle cx="390" cy="285" r="26" fill="#f8fafc" stroke="#0f172a" stroke-width="10" />
    <!-- Bicep & Forearm -->
    <path d="M400 290 Q460 280 450 210 Q420 200 400 230" fill="#f8fafc" stroke="#0f172a" stroke-width="10" stroke-linejoin="round" />
    <path d="M445 245 Q460 230 442 215" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Right Fist -->
    <circle cx="395" cy="225" r="22" fill="#f8fafc" stroke="#0f172a" stroke-width="10" />

    <!-- Strong Muscular Neck -->
    <rect x="285" y="220" width="40" height="65" fill="#f8fafc" stroke="#0f172a" stroke-width="10" stroke-linejoin="round" />

    <!-- Round Head -->
    <circle cx="305" cy="165" r="65" fill="#f8fafc" stroke="#0f172a" stroke-width="12" />

    <!-- Confident / Proud Face -->
    <!-- Eyes -->
    <circle cx="285" cy="155" r="8" fill="#0f172a" />
    <circle cx="330" cy="155" r="8" fill="#0f172a" />
    <!-- Confident Eyebrows (slanted determined) -->
    <line x1="272" y1="135" x2="298" y2="142" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
    <line x1="342" y1="135" x2="316" y2="142" stroke="#0f172a" stroke-width="7" stroke-linecap="round" />
    <!-- Big Proud Grin -->
    <path d="M285 180 Q305 205 330 180" stroke="#0f172a" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Yellow Construction / Factory Hard Hat -->
    <path d="M225 140 Q305 60 385 140 Z" fill="#facc15" stroke="#0f172a" stroke-width="10" stroke-linejoin="round" />
    <path d="M215 140 L395 140" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    <!-- Hat Crown Ridge -->
    <path d="M305 75 L305 130" stroke="#eab308" stroke-width="8" stroke-linecap="round" />

  </g>

  <!-- Speech / Badge: Ready on time -->
  <g transform="translate(510, 100)">
    <rect x="0" y="0" width="240" height="90" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="6" />
    <polygon points="20,90 40,90 10,120" fill="#ffffff" stroke="#0f172a" stroke-width="6" stroke-linejoin="round" />
    <!-- Cover border seam -->
    <polygon points="22,86 38,86 16,114" fill="#ffffff" />
    <text x="120" y="38" font-family="'Inter', sans-serif" font-weight="900" font-size="17" fill="#0f172a" text-anchor="middle">12,000 GARMENTS</text>
    <text x="120" y="66" font-family="'Inter', sans-serif" font-weight="800" font-size="15" fill="#0d9488" text-anchor="middle">✓ READY ON TIME</text>
  </g>
</svg>
